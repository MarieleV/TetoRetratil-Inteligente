<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="100%" height="100%" style="font-family: Arial, sans-serif; background-color: #ffffff;">
  <defs>
    <!-- Arrowhead Definition -->
    <marker id="arrow-hw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333" />
    </marker>
    <!-- Shadow for Blocks -->
    <filter id="shadow-hw" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="3" dy="4" stdDeviation="3" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Title -->
  <text x="450" y="40" font-size="20" font-weight="bold" text-anchor="middle" fill="#333333">Diagrama de Blocos de Hardware do Sistema TRI</text>

  <!-- NETWORK BLOCK (External) -->
  <rect x="350" y="70" width="200" height="70" rx="8" fill="#e6f2ff" stroke="#00599C" stroke-width="2" filter="url(#shadow-hw)" />
  <text x="450" y="100" font-size="14" font-weight="bold" fill="#003366" text-anchor="middle">Conexão de Rede</text>
  <text x="450" y="120" font-size="12" fill="#003366" text-anchor="middle">(Wi-Fi / Nuvem MQTT)</text>

  <!-- LOCAL SYSTEM BOUNDARY -->
  <rect x="40" y="190" width="820" height="320" rx="15" fill="none" stroke="#666666" stroke-width="2" stroke-dasharray="8,4" />
  <text x="450" y="215" font-size="16" font-weight="bold" fill="#333333" text-anchor="middle">Sistema Local TRI</text>

  <!-- SENSOR 1: Rain -->
  <rect x="70" y="260" width="160" height="70" rx="8" fill="#e6f2ff" stroke="#00599C" stroke-width="2" filter="url(#shadow-hw)" />
  <text x="150" y="295" font-size="14" font-weight="bold" fill="#003366" text-anchor="middle">Sensor de Chuva</text>
  <text x="150" y="315" font-size="12" fill="#003366" text-anchor="middle">(FC-37)</text>

  <!-- SENSOR 2: Climate -->
  <rect x="70" y="380" width="160" height="70" rx="8" fill="#e6f2ff" stroke="#00599C" stroke-width="2" filter="url(#shadow-hw)" />
  <text x="150" y="415" font-size="14" font-weight="bold" fill="#003366" text-anchor="middle">Sensor de Clima</text>
  <text x="150" y="435" font-size="12" fill="#003366" text-anchor="middle">(DHT22)</text>

  <!-- CENTRAL CONTROLLER -->
  <rect x="350" y="270" width="200" height="150" rx="8" fill="#e6f2ff" stroke="#00599C" stroke-width="2" filter="url(#shadow-hw)" />
  <text x="450" y="340" font-size="16" font-weight="bold" fill="#003366" text-anchor="middle">Módulo Central</text>
  <text x="450" y="365" font-size="14" fill="#003366" text-anchor="middle">(ESP32)</text>

  <!-- MOTOR DRIVER -->
  <rect x="620" y="310" width="120" height="70" rx="8" fill="#e6f2ff" stroke="#00599C" stroke-width="2" filter="url(#shadow-hw)" />
  <text x="680" y="345" font-size="14" font-weight="bold" fill="#003366" text-anchor="middle">Ponte H</text>
  <text x="680" y="365" font-size="12" fill="#003366" text-anchor="middle">(L298N)</text>

  <!-- ACTUATOR -->
  <rect x="780" y="310" width="60" height="70" rx="8" fill="#e6f2ff" stroke="#00599C" stroke-width="2" filter="url(#shadow-hw)" />
  <text x="810" y="345" font-size="14" font-weight="bold" fill="#003366" text-anchor="middle">Motor</text>
  <text x="810" y="365" font-size="12" fill="#003366" text-anchor="middle">(Teto)</text>

  <!-- CONNECTIONS (Lines and Arrows) -->
  
  <!-- Wi-Fi to ESP32 -->
  <path d="M 450 140 L 450 265" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-hw)" marker-start="url(#arrow-hw)" />
  <text x="460" y="180" font-size="11" fill="#333333">Wi-Fi (TCP/IP)</text>

  <!-- Rain Sensor to ESP32 -->
  <path d="M 230 295 L 345 295" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-hw)" />
  <text x="287" y="285" font-size="11" fill="#333333" text-anchor="middle">Sinal Digital</text>
  <text x="287" y="310" font-size="10" fill="#666666" text-anchor="middle">(GPIO 8)</text>

  <!-- Climate Sensor to ESP32 -->
  <path d="M 230 415 L 290 415 L 290 390 L 345 390" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-hw)" />
  <text x="290" y="380" font-size="11" fill="#333333" text-anchor="middle">One-Wire</text>

  <!-- ESP32 to H-Bridge -->
  <path d="M 550 345 L 615 345" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-hw)" />
  <text x="582" y="325" font-size="11" fill="#333333" text-anchor="middle">Sinais de Controle</text>
  <text x="582" y="340" font-size="10" fill="#666666" text-anchor="middle">(PWM/Direção)</text>

  <!-- H-Bridge to Motor -->
  <path d="M 740 345 L 775 345" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-hw)" />
  <text x="757" y="335" font-size="11" fill="#333333" text-anchor="middle">Potência</text>
</svg>
